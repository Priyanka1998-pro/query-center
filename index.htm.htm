<!DOCTYPE html>
<head>
    <title>Div practise</title>
    <style>
        /* 1. Animation ke liye angle variable banayein */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        .container{
            margin: 200px auto;
            padding:30px;
            width:1000px;
            background: rgb(221, 215, 215);
            box-sizing: border-box;
            border-radius: 20px;
            box-shadow: 0px 0px 15px gray;
            /* Chalti border ke liye relative position zaroori hai */
            position: relative; 
            z-index: 1;
        }
         /* 3. Chalti hui border ka effect (Pseudo-element) */
        .container::before {
            content: '';
            position: absolute;
            top: -5px;      /* Border ki motai (thickness) */
            left: -5px;
            right: -5px;
            bottom: -5px;
            
            /* Border ke rang (Aap ise change kar sakti hain) */
            background: conic-gradient(from var(--angle), transparent 20%, #c4c0c2, #ecf4f5, transparent 80%);
            border-radius: 25px; /* Container ke corner se match karne ke liye thoda bada radius */
            z-index: -1;         /* Border ko container ke peeche bhejne ke liye */
            animation: spin 4s linear infinite; /* Chalne ki speed (4 seconds) */
        }
         /* 4. Border ghumane ka animation */
        @keyframes spin {
            0% {
                --angle: 0deg;
            }
            100% {
                --angle: 360deg;
            }
        }
        .main_container{
            margin:30px auto;
            padding:20px;
            background: white;
            box-sizing: border-box;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgb(252, 249, 249);
            display:flex;
            justify-content: space-between;
            align-items: center;
        }
        .part1{
            padding:20px;
            background:rgb(221, 215, 215);
            box-sizing: border-box;
            border-radius: 20px;
        }
        .part2{
            width:400px;
            height: 180px;
            padding:20px;
            background:rgb(221, 215, 215);
            box-sizing: border-box;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div class="container">
     <h2 align="center"><u>QUERY CENTER</u></h2>
    <div class="main_container">
    <div class="part1">
        <h4>Ask Your Query...</h4>
        <hr>
        <div class="chat">
            <p>What's your name?</p>
            <input type="text" id="que1" name="inputbox"/>
            <button type="submit" onClick="response()">Send</button>
        </div>
    </div>
    <div class="part2">
        <h4>AI Assistant</h4>
        <hr>
        <p id="ans1"></p>
    </div>
</div></div>
<script>
    let que=document.getElementById("que1");
    let ans=document.getElementById("ans1");
    
    function response(){
              let value=que.value;
              ans.innerText="Hello " +value + "! How can i assist you ?";
              que.value="";
    }
</script>
</body>
</html>
